name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A cancelled run only stops streaming: the server finishes the deploy it started
# and serializes the next one behind a lock (deploy/deploy-main.sh).
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://spectwin.rfh.et
    steps:
      - name: Deploy main to the OCI host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_TARGET }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command ignores everything but a commit on main.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$TARGET" "$COMMIT"
          curl -fsS --retry 5 --retry-delay 5 https://spectwin.rfh.et/health
