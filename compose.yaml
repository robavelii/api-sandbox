services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spectwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: spectwin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectwin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
